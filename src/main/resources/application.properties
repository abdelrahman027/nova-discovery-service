# =========================================================
# Load .env file
# =========================================================
spring.config.import=optional:file:.env[.properties]


# =========================================================
# Application
# =========================================================
spring.application.name=${APP_NAME:discovery-service}
server.port=${SERVER_PORT:8761}


# =========================================================
# Eureka Client configs
# =========================================================
eureka.client.register-with-eureka=${EUREKA_REGISTER_WITH_EUREKA:false}
eureka.client.fetch-registry=${EUREKA_FETCH_REGISTRY:false}


# =========================================================
# Actuator
# =========================================================
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:*}